# .github/workflows/fuzz.yml
name: Fuzzing (cargo-fuzz + libFuzzer)

on:
  # Run on every PR (quick smoke fuzzing)
  pull_request:
    branches: ["main", "develop"]
  # Deeper fuzzing on main + nightly schedule
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 3 AM UTC

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz Shamir Secret Sharing
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install nightly Rust (required for libFuzzer)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          components: rust-src

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "fuzz"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Build all fuzz targets (fast check that they compile)
      - name: Build fuzz targets
        run: cargo +nightly fuzz build --dev

      # Run the roundtrip fuzzer for a short time on PRs / push
      # (60 seconds is enough to catch regressions without slowing CI)
      - name: Fuzz roundtrip (quick)
        if: github.event_name != 'schedule'
        run: |
          cargo +nightly fuzz run shamir_roundtrip \
            -- -max_total_time=60 \
            -timeout=5 \
            -rss_limit_mb=2048

      # Longer fuzzing on the weekly schedule (deeper coverage)
      - name: Fuzz roundtrip (deep)
        if: github.event_name == 'schedule'
        run: |
          cargo +nightly fuzz run shamir_roundtrip \
            -- -max_total_time=1800 \   # 30 minutes
            -timeout=10 \
            -rss_limit_mb=4096
