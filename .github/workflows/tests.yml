name: Run Unit/Integration tests

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  tests:
    name: Run unit tests + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9e57365e36de1e26dea5145e57d471261468d9f7 # cargo-llvm-cov

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Run tests with coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --workspace --features fast-inverse
          cargo llvm-cov --no-report --workspace --no-default-features
          cargo llvm-cov --no-report --workspace --all-features
      - name: Generate combined coverage report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
